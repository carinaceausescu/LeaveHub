spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/leave_hub
spring.datasource.username=carinaceausescu
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Limite pentru documentele justificative incarcate (certificate medicale etc.)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Directorul de stocare a atasamentelor
leavehub.upload-dir=${user.home}/leave-hub-uploads

# Originea permisa pentru aplicatia Angular
leavehub.cors.allowed-origin=http://localhost:4200

# Parola implicita atribuita angajatilor care nu au inca una setata
leavehub.default-password=parola123
