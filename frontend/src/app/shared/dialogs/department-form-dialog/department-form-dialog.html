<h2 mat-dialog-title>{{ isEdit ? 'Editează departament' : 'Departament nou' }}</h2>

<mat-dialog-content class="dialog-form">
    <mat-form-field appearance="outline" class="full-width">
        <mat-label>Nume departament</mat-label>
        <input matInput [ngModel]="departmentName()" (ngModelChange)="departmentName.set($event)">
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
        <mat-label>Nr. maxim angajați absenți simultan</mat-label>
        <input matInput type="number" [ngModel]="maxAbsentEmployees()" (ngModelChange)="maxAbsentEmployees.set($event)">
    </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-button (click)="cancel()">Renunță</button>
    <button mat-flat-button color="primary" (click)="save()">Salvează</button>
</mat-dialog-actions>
